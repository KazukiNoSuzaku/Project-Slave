[project]
name = "project-slave"
version = "0.1.0"
description = "Behavioral anomaly detection and surgical quarantine for multi-agent LLM swarms"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "duckdb>=1.1",
    "pyarrow>=17",
    "river>=0.21",
    "torch>=2.4",
    "torch-geometric>=2.6",
]

[project.scripts]
slave-dashboard = "slave.dashboard.server:main"
slave-sim = "slave.sim.cli:main"
slave-eval = "slave.eval.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
